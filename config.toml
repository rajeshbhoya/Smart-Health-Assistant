# Base Streamlit theme — matches the app's design-system colors (light mode
# baseline; ui/theme.py's CSS variables layer dark-mode overrides on top).
[theme]
base = "light"
primaryColor = "#0F3D5C"
backgroundColor = "#F4F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
